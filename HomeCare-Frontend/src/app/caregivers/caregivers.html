<h1>CareGivers</h1>

<button (click)="getCaregivers()">Load CareGivers</button>

<ul>
  @for (caregiver of caregivers; track caregiver.id) {
    <li>
      <p>Name: {{ caregiver.name }}</p>
      <p>Email: {{ caregiver.email }}</p>
      <p>City: {{ caregiver.city }}</p>
      <p>Rate: {{ caregiver.rate }}</p>
    </li>
  }
</ul>

<div class="caregiver-form">

  <h2>Add CareGiver</h2>

  <form (ngSubmit)="createCaregiver()">
